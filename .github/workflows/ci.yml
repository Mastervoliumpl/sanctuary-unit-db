# Everything here runs without a game install: the extracted data and art are
# committed, so CI checks they're consistent, the code typechecks, the tests
# pass, and the site actually builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      # Build before typecheck: src/routeTree.gen.ts is generated by the Vite
      # build and gitignored, so tsc can't resolve it on a fresh clone.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:modding-versions
